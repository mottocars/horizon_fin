# Site público (estático, não é SPA). O Nginx do host entrega /site/ para cá já sem o prefixo
# (proxy_pass http://127.0.0.1:3012/), então aqui o site fica na raiz.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json;
    gzip_min_length 1024;

    error_page 404 /404.html;

    # Cabeçalhos repetidos em cada location: um add_header dentro de location apaga os de fora.
    # index.html sempre pergunta se mudou (304 quase de graça) — um deploy aparece na hora.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Arquivos com hash no nome (Vite): cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }
}
