server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O index.html é quem aponta pros arquivos (com hash) do build novo. Sem nenhum
    # Cache-Control, o navegador decide sozinho por quanto tempo reaproveitar a cópia que
    # já tem — e continua abrindo a versão ANTIGA do sistema por horas depois de um deploy,
    # até o usuário forçar a atualização (Ctrl+F5). `no-cache` = guarda, mas sempre pergunta
    # ao servidor se mudou (resposta 304, quase de graça). Vale também pras rotas do SPA e
    # pra "/": todas caem no index.html por redirecionamento interno e passam por aqui.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA — qualquer rota que não seja um arquivo real cai no index.html,
    # pra o React Router assumir o roteamento no cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # assets com hash no nome (Vite) podem ser cacheados por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
