# Documentação da API Horizon (estática). O Nginx do host entrega / para cá e /v1/ para o backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;
    gzip_min_length 1024;

    # Cabeçalhos de segurança repetidos em cada location (um add_header dentro de location apaga os
    # de fora). A página só fala com o próprio domínio (connect-src 'self'): a chave digitada no
    # "Testar" não tem para onde vazar.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'";

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp;
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "no-referrer";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp;
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "no-referrer";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
    }

    # Arquivos com hash no nome (Vite): cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }
}
