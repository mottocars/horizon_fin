services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - horizonfin_uploads:/app/uploads
    # Só acessível via loopback do host — quem expõe pra internet é o Nginx
    # do host, que já cuida do domínio do sistema que já existe na VPS.
    ports:
      - "127.0.0.1:3011:3001"
    networks:
      - default
      # Rede do Postgres que já existe na VPS (container horizonhub-db-1,
      # serviço "db") — conecta aqui em vez de expor a porta do Postgres,
      # mesmo ela já estando publicada no host.
      - horizonhub_default

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:80"
    depends_on:
      - backend

  # Site público (site/), estático. Pré-lançamento em financas.horizonhub.com.br/site: o Nginx do host
  # entrega /site/ para cá. Endereço e indexação são fixados no build (ver site/Dockerfile).
  site:
    build:
      context: ./site
      args:
        VITE_BASE: /site/
        VITE_SITE_URL: https://financas.horizonhub.com.br/site
    restart: unless-stopped
    ports:
      - "127.0.0.1:3012:80"

  # Documentação da API Horizon (api-docs/), estática. Em api.horizonhub.com.br o Nginx do host
  # entrega / para cá e /v1/ para o backend (ver api-docs/README.md).
  api-docs:
    build:
      context: ./api-docs
    restart: unless-stopped
    ports:
      - "127.0.0.1:3013:80"

volumes:
  horizonfin_uploads:

networks:
  default:
  horizonhub_default:
    external: true
